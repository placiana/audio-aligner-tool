services:
  aligner:
    build: .
    container_name: audio-aligner
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
      - ./db:/app/db
    environment:
      - FLASK_ENV=production
      - DATABASE_FILE=/app/db/aligner.db
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-true}
    restart: always

  proxy:
    image: caddy:2-alpine
    container_name: caddy-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    restart: always
    depends_on:
      - aligner

volumes:
  caddy_data:
  caddy_config:
