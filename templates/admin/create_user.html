{% extends 'base.html' %}

{% block title %}Crear Nuevo Usuario - Admin{% endblock %}

{% block content %}
<div class="brutalist-card" style="max-width: 500px; margin: 40px auto; background: white; border-radius: 0;">
    <h2 style="margin-top: 0; font-size: 24px; font-weight: 900; border-bottom: 2.5px solid var(--border-color); padding-bottom: 15px; text-transform: uppercase;">
        ➕ Crear Nuevo Usuario
    </h2>
    <form method="post" style="display: flex; flex-direction: column; gap: 20px;">
        <div style="display: flex; flex-direction: column; gap: 8px;">
            <label for="username" style="font-weight: 800; font-size: 14px; text-transform: uppercase;">Nombre de Usuario</label>
            <input type="text" id="username" name="username" class="brutalist-input" placeholder="Ej. juan_perez" required>
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px;">
            <label for="password" style="font-weight: 800; font-size: 14px; text-transform: uppercase;">Contraseña</label>
            <input type="password" id="password" name="password" class="brutalist-input" placeholder="Escribe la contraseña temporal" required>
        </div>

        <div style="display: flex; gap: 10px; align-items: center;">
            <input type="checkbox" id="is_admin" name="is_admin" value="1" style="width: 20px; height: 20px; cursor: pointer; accent-color: var(--accent-secondary);">
            <label for="is_admin" style="font-weight: 800; font-size: 14px; text-transform: uppercase; cursor: pointer;">¿Es Administrador?</label>
        </div>

        <div style="display: flex; gap: 15px; margin-top: 10px;">
            <button type="submit" class="brutalist-button" style="flex: 1; box-shadow: 2px 2px 0px var(--border-color); background: var(--accent-secondary);">
                ➕ Crear Usuario
            </button>
            <a href="/admin" class="brutalist-button secondary-btn button-link" style="flex: 1; text-align: center; box-shadow: 2px 2px 0px var(--border-color);">
                Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
